# tmux.conf -- portable tmux configuration
#
# Design goals:
#   * Work on tmux as old as ~3.0 while staying correct on modern tmux (3.6+).
#   * Pair well with WezTerm: true color + system clipboard via OSC 52.
#   * Beginner-friendly, documented defaults. No plugins, no TPM.
#
# This file is symlinked to ~/.tmux.conf by install.sh (the classic location),
# which is understood by every tmux version including those older than 3.1
# that do not read ~/.config/tmux/tmux.conf.

# ---------------------------------------------------------------------------
# Prefix
# ---------------------------------------------------------------------------
# Use Ctrl-Space instead of the default Ctrl-b. Ctrl-b is an awkward same-hand
# reach and collides with readline/vim "back one char"; Ctrl-Space is a comfy
# two-hand chord that nothing in this setup binds -- WezTerm's defaults leave it
# free, and nvim does not bind it, so it reaches tmux cleanly. `send-prefix`
# lets you type a literal Ctrl-Space by pressing the prefix twice.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ---------------------------------------------------------------------------
# Terminal / true color
# ---------------------------------------------------------------------------
# Inside tmux, advertise a 256-color terminal. "tmux-256color" is the correct,
# modern choice and is what WezTerm's terminfo expects. If your system lacks
# the tmux-256color terminfo entry, change this to "screen-256color".
set -g default-terminal "tmux-256color"

# Tell tmux the OUTER terminal supports RGB / true color. WezTerm uses
# xterm-256color by default, so the first override is active for this config.
# The wezterm entry also supports users who explicitly install WezTerm's
# terminfo and opt into TERM=wezterm. Tc works on a wider range of tmux versions
# than terminal-features (added in 3.2).
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",wezterm:Tc"

# ---------------------------------------------------------------------------
# General behavior / beginner-sensible defaults
# ---------------------------------------------------------------------------
# Start windows and panes at 1 (not 0) so they line up with the number-key row.
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed so there are no gaps.
set -g renumber-windows on

# Fast, but not zero: a small escape-time avoids swallowing Meta/Alt sequences
# while keeping the Esc key responsive in editors like vim.
set -sg escape-time 10

# A generous scrollback buffer.
set -g history-limit 10000

# Enable the mouse: click to select panes/windows, drag to resize, scroll to
# enter copy mode and scroll history.
set -g mouse on

# Pass focus events through to applications (e.g. editors that auto-reload).
set -g focus-events on

# ---------------------------------------------------------------------------
# Copy mode / clipboard (vi keys + OSC 52 for WezTerm)
# ---------------------------------------------------------------------------
# Use vi-style keys in copy mode.
setw -g mode-keys vi

# Let tmux emit OSC 52 escape sequences so yanks reach the system clipboard.
# WezTerm honors OSC 52, so local copy-mode yanks reach the system clipboard
# without an external helper like pbcopy/xclip/wl-copy. Over SSH, the remote
# tmux must also support and enable set-clipboard.
set -g set-clipboard on

# vi-like selection/yank inside copy mode. `copy-pipe-and-cancel` with no shell
# command still routes through tmux's own clipboard (OSC 52) machinery.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# ---------------------------------------------------------------------------
# Splits (inherit the current pane's working directory)
# ---------------------------------------------------------------------------
# Mnemonic: | looks like a vertical divider -> side-by-side (horizontal split).
#           - looks like a horizontal divider -> stacked  (vertical split).
# `-c "#{pane_current_path}"` makes new panes open in the same directory as the
# pane they were created from (supported since tmux 1.9).
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ---------------------------------------------------------------------------
# Pane navigation and resizing
# ---------------------------------------------------------------------------
# prefix + h/j/k/l : move between panes (vim directions).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# prefix + H/J/K/L : resize the current pane. Repeatable (-r) so you can hold
# the direction after the prefix to nudge repeatedly.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------------------------------------------------------------------------
# Config reload
# ---------------------------------------------------------------------------
# prefix + r : reload this config and show a visible confirmation message.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ---------------------------------------------------------------------------
# Status bar -- Rose Pine Moon inspired, text-first
# ---------------------------------------------------------------------------
# Colors below are drawn from the Rose Pine Moon palette:
#   base      #232136   surface   #2a273f   overlay   #393552
#   text      #e0def4   muted     #6e6a86   subtle    #908caa
#   iris      #c4a7e7   foam      #9ccfd8   gold      #f6c177
#   love      #eb6f92   pine      #3e8fb0   rose      #ea9a97
#
# The base bar (session, clock, window list) avoids Nerd Font glyphs so it stays
# readable even with a fallback font. The agent-status overlay (@agent_glyphs,
# see the Agent status section below) DOES use Nerd Font glyphs; it renders
# empty when no agent is present, so the base bar is unaffected without them.
# Placed at the top so it's visually distinct from the app status bars
# (opencode / nvim) that live at the bottom of each pane.

set -g status on
set -g status-interval 5
set -g status-position top
set -g status-justify left

# Overall bar: NO background of its own. `bg=default` inherits the terminal's
# background (including WezTerm's translucency/blur), so the bar dissolves into
# the content instead of painting an opaque slab across the top. The only things
# that carry a background are the active-window tab and (when named) the session
# pill -- those become the intentional splashes of color.
set -g status-style "bg=default,fg=#e0def4"

# Left: session name on an iris pill -- but ONLY when the session is actually
# named. The default auto-name is "0" (numeric); showing it is pure noise, so we
# blank status-left in that case via tmux's native ternary #{?cond,then,else}
# and string-equality #{==:a,b}. Name a session (tmux new -s <name>) and the
# pill reappears automatically. No background when blank, so the bar stays clean.
set -g status-left-length 40
set -g status-left "#{?#{==:#S,0},,#[bg=#c4a7e7,fg=#232136,bold] #S #[default]}"

# Right: hostname then date/time, muted so it doesn't shout.
set -g status-right-length 80
set -g status-right "#[fg=#9ccfd8] #H #[fg=#6e6a86]| #[fg=#908caa]%Y-%m-%d #[fg=#e0def4]%H:%M "

# Window list: inactive windows muted, the active one highlighted with gold.
# #{@agent_glyphs} is the agent-status overlay (one glyph per running agent in
# the window; empty when none). #W is the real window name (brain- or manually-
# authored). See the Agent status section below.
# Layout: "index. glyph name" -- the window index leads (so the numbers you
# navigate with are the anchor), then the agent glyph, then the name. The glyph
# + its trailing space render ONLY when an agent is present
# (via #{?#{@agent_glyphs},...,}), so agent-less windows read cleanly as
# "1. name" with no dangling gap. Inactive tabs are muted with no background
# (they float on the transparent bar); the active tab is a fully highlighted
# gold block. window-status-separator gaps the tabs apart.
#
# NOTE the "#[fg=...]" immediately before #W: the agent glyph resets foreground
# to terminal-default after itself (so its state color doesn't bleed), which
# would otherwise leave the NAME rendering in harsh terminal-white. We re-assert
# the tab's intended name color right before #W so the name's color is explicit
# and independent of whether a glyph preceded it.
setw -g window-status-format "#[fg=#6e6a86] #I. #{?#{@agent_glyphs},#{@agent_glyphs} ,}#[fg=#6e6a86]#W "
setw -g window-status-current-format "#[bg=#f6c177,fg=#232136,bold] #I. #{?#{@agent_glyphs},#{@agent_glyphs} ,}#[fg=#232136]#W "
setw -g window-status-separator " "
# Explicitly clear tmux's built-in styles. window-status-current-style defaults
# to "underscore" (an underline on the active tab) -- override to none so the
# gold block is clean. Our per-tab colors live in the *-format strings above,
# so these styles only need to carry non-color attributes (i.e. nothing).
setw -g window-status-style "default"
setw -g window-status-current-style "default"

# Pane borders. These do double duty:
#   1. pane-border-status=top draws a border line at the TOP of each pane. For
#      the topmost pane that line sits directly under the status bar, giving a
#      crisp horizontal SEPARATOR between the (transparent) bar and the content
#      -- native, no wasted status row. pane-border-format is blanked to "" so
#      the line is a clean rule, not tmux's default index/title/flags label.
#   2. the active pane's border is GOLD (#f6c177), matching the active-window
#      tab -- so "what's focused" reads consistently in the tab strip and the
#      pane frame. Inactive borders are muted overlay so they recede.
set -g pane-border-status top
set -g pane-border-format ""
set -g pane-border-style "fg=#393552"
set -g pane-active-border-style "fg=#f6c177"

# Messages / command prompt line.
set -g message-style "bg=#393552,fg=#e0def4"
set -g message-command-style "bg=#393552,fg=#e0def4"

# Copy-mode selection highlight.
setw -g mode-style "bg=#44415a,fg=#e0def4"

# ---------------------------------------------------------------------------
# Agent status (tmux-agent-status feature)
# ---------------------------------------------------------------------------
# Surfaces the state (working / needs-input / done) and title of AI-agent
# sessions (opencode, ...) running in each pane, as a per-window overlay in the
# status bar. Architecture (see dotfiles/tmux/README or the scripts/plugin):
#
#   opencode plugin (plugins/tmux-agent-state.ts, symlinked into
#     ~/.config/opencode/plugins/) writes per-pane @agent_state + @agent_title
#     on session events, then runs the brain below.
#   brain (scripts/tmux-window-name.sh) rolls per-pane state up to the window:
#     sets #W (the name; leaves manual `<prefix> ,` names alone) and
#     @agent_glyphs (one themed glyph per agent), which window-status-format
#     renders.
#   theme (themes/spaceflight/) maps each state to a glyph.
#
# Non-agent panes never set @agent_state, so this is inert for normal windows.

# Where the scripts live. The whole tmux/ dir is symlinked to ~/.config/tmux by
# install.sh, so scripts/ resolves at ~/.config/tmux/scripts. Stored as a tmux
# option (NOT set-environment: that rejects ${:-} and does not expand formats).
# tmux does parse-time $HOME substitution here, storing an absolute path; hooks
# and bindings expand #{@agent_script_dir} at fire time.
set -g @agent_script_dir "$HOME/.config/tmux/scripts"

# Recompute the active window's name + glyphs when the window changes or a pane's
# focus/layout shifts. Agent events additionally poke the brain directly from the
# plugin, so these hooks mainly cover the 0-agent inference + manual navigation.
set-hook -g after-select-window 'run-shell "#{@agent_script_dir}/tmux-window-name.sh #{window_id}"'
set-hook -g pane-focus-in       'run-shell "#{@agent_script_dir}/tmux-window-name.sh #{window_id}"'

# prefix + R : hand a window's name back to the brain (undo a manual rename).
# Clears the manual-rename state so auto-naming resumes on the next update.
bind R set-window-option automatic-rename on \; set-window-option -u @agent_brain_named \; run-shell "#{@agent_script_dir}/tmux-window-name.sh #{window_id}" \; display-message "agent auto-naming re-enabled"
