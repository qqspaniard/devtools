# tmux.conf -- portable tmux configuration
#
# Design goals:
#   * Work on tmux as old as ~3.0 while staying correct on modern tmux (3.6+).
#   * Pair well with WezTerm: true color + system clipboard via OSC 52.
#   * Beginner-friendly, documented defaults. No plugins, no TPM.
#
# This file is symlinked to ~/.tmux.conf by install.sh (the classic location),
# which is understood by every tmux version including those older than 3.1
# that do not read ~/.config/tmux/tmux.conf.

# ---------------------------------------------------------------------------
# Prefix
# ---------------------------------------------------------------------------
# Keep the standard Ctrl-b prefix so muscle memory and docs match. WezTerm does
# not intercept Ctrl-b, so it reaches tmux naturally.
set -g prefix C-b
bind C-b send-prefix

# ---------------------------------------------------------------------------
# Terminal / true color
# ---------------------------------------------------------------------------
# Inside tmux, advertise a 256-color terminal. "tmux-256color" is the correct,
# modern choice and is what WezTerm's terminfo expects. If your system lacks
# the tmux-256color terminfo entry, change this to "screen-256color".
set -g default-terminal "tmux-256color"

# Tell tmux the OUTER terminal supports RGB / true color. WezTerm uses
# xterm-256color by default, so the first override is active for this config.
# The wezterm entry also supports users who explicitly install WezTerm's
# terminfo and opt into TERM=wezterm. Tc works on a wider range of tmux versions
# than terminal-features (added in 3.2).
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",wezterm:Tc"

# ---------------------------------------------------------------------------
# General behavior / beginner-sensible defaults
# ---------------------------------------------------------------------------
# Start windows and panes at 1 (not 0) so they line up with the number-key row.
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed so there are no gaps.
set -g renumber-windows on

# Fast, but not zero: a small escape-time avoids swallowing Meta/Alt sequences
# while keeping the Esc key responsive in editors like vim.
set -sg escape-time 10

# A generous scrollback buffer.
set -g history-limit 10000

# Enable the mouse: click to select panes/windows, drag to resize, scroll to
# enter copy mode and scroll history.
set -g mouse on

# Pass focus events through to applications (e.g. editors that auto-reload).
set -g focus-events on

# ---------------------------------------------------------------------------
# Copy mode / clipboard (vi keys + OSC 52 for WezTerm)
# ---------------------------------------------------------------------------
# Use vi-style keys in copy mode.
setw -g mode-keys vi

# Let tmux emit OSC 52 escape sequences so yanks reach the system clipboard.
# WezTerm honors OSC 52, so local copy-mode yanks reach the system clipboard
# without an external helper like pbcopy/xclip/wl-copy. Over SSH, the remote
# tmux must also support and enable set-clipboard.
set -g set-clipboard on

# vi-like selection/yank inside copy mode. `copy-pipe-and-cancel` with no shell
# command still routes through tmux's own clipboard (OSC 52) machinery.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# ---------------------------------------------------------------------------
# Splits (inherit the current pane's working directory)
# ---------------------------------------------------------------------------
# Mnemonic: | looks like a vertical divider -> side-by-side (horizontal split).
#           - looks like a horizontal divider -> stacked  (vertical split).
# `-c "#{pane_current_path}"` makes new panes open in the same directory as the
# pane they were created from (supported since tmux 1.9).
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ---------------------------------------------------------------------------
# Pane navigation and resizing
# ---------------------------------------------------------------------------
# prefix + h/j/k/l : move between panes (vim directions).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# prefix + H/J/K/L : resize the current pane. Repeatable (-r) so you can hold
# the direction after the prefix to nudge repeatedly.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------------------------------------------------------------------------
# Config reload
# ---------------------------------------------------------------------------
# prefix + r : reload this config and show a visible confirmation message.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ---------------------------------------------------------------------------
# Status bar -- Rose Pine Moon inspired, text-first
# ---------------------------------------------------------------------------
# Colors below are drawn from the Rose Pine Moon palette:
#   base      #232136   surface   #2a273f   overlay   #393552
#   text      #e0def4   muted     #6e6a86   subtle    #908caa
#   iris      #c4a7e7   foam      #9ccfd8   gold      #f6c177
#   love      #eb6f92   pine      #3e8fb0   rose      #ea9a97
#
# The bar deliberately avoids Nerd Font glyphs: it stays readable even if the
# Nerd Font is missing and a fallback font is used.

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

# Overall bar background/foreground.
set -g status-style "bg=#232136,fg=#e0def4"

# Left: session name on an iris background.
set -g status-left-length 40
set -g status-left "#[bg=#c4a7e7,fg=#232136,bold] #S #[bg=#232136,fg=#c4a7e7]"

# Right: hostname then date/time, muted so it doesn't shout.
set -g status-right-length 80
set -g status-right "#[fg=#9ccfd8] #H #[fg=#6e6a86]| #[fg=#908caa]%Y-%m-%d #[fg=#e0def4]%H:%M "

# Window list: inactive windows muted, the active one highlighted with gold.
setw -g window-status-format "#[fg=#6e6a86] #I:#W "
setw -g window-status-current-format "#[bg=#393552,fg=#f6c177,bold] #I:#W "
setw -g window-status-separator ""

# Pane borders: subtle for inactive, foam for the active pane.
set -g pane-border-style "fg=#393552"
set -g pane-active-border-style "fg=#9ccfd8"

# Messages / command prompt line.
set -g message-style "bg=#393552,fg=#e0def4"
set -g message-command-style "bg=#393552,fg=#e0def4"

# Copy-mode selection highlight.
setw -g mode-style "bg=#44415a,fg=#e0def4"
